<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicons: Google Search needs a square icon in a multiple of 48px, linked from the homepage. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f1eee7" />
    <!-- The SEO snapshot is replaced (not hydrated) by React. Keep it from
         flashing while JS starts, but reveal it if the app fails to load.
         Inline CSS works before assets load and with our existing CSP. -->
    <style>
      @media (scripting: enabled) {
        #root > [data-seo-fallback] {
          visibility: hidden;
          animation: seo-fallback-reveal 0s 8s forwards;
        }
      }
      @keyframes seo-fallback-reveal {
        to { visibility: visible; }
      }
    </style>

    <!-- Defaults; each route updates these at runtime via <Seo /> -->
    <title>Noisemakers News | Inspirational Interviews &amp; Stories</title>
    <meta name="description" content="Official platform for Noisemakers News, featuring inspirational interviews, impactful stories, and insightful discussions across all aspects of life." />
    <meta property="og:site_name" content="Noisemakers News" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Noisemakers News | Inspirational Interviews &amp; Stories" />
    <meta property="og:description" content="A video podcast of inspirational interviews and stories about marriage, parenting, family and recovery." />
    <meta property="og:image" content="https://noisemakersnews.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Noisemakers News | Inspirational Interviews &amp; Stories" />
    <meta name="twitter:description" content="A video podcast of inspirational interviews and stories about marriage, parenting, family and recovery." />
    <meta name="twitter:image" content="https://noisemakersnews.com/og-image.png" />

    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Noisemakers needs JavaScript to show episodes. You can watch every episode on YouTube:
      <a href="https://www.youtube.com/@noisemakersnews">youtube.com/@noisemakersnews</a>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
