<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#fbfaf7" />

    <!-- Defaults; each route updates these at runtime via <Seo /> -->
    <title>Noisemakers: Not all noise is bad noise</title>
    <meta name="description" content="Noisemakers is a video podcast of inspirational interviews and stories about marriage, parenting, family and the journeys that shape us. Not all noise is bad noise." />
    <meta property="og:site_name" content="Noisemakers" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Noisemakers: Not all noise is bad noise" />
    <meta property="og:description" content="A video podcast of inspirational interviews and stories about marriage, parenting, family and recovery." />
    <meta property="og:image" content="https://noisemakersnews.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Noisemakers: Not all noise is bad noise" />
    <meta name="twitter:description" content="A video podcast of inspirational interviews and stories about marriage, parenting, family and recovery." />
    <meta name="twitter:image" content="https://noisemakersnews.com/og-image.png" />

    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Noisemakers needs JavaScript to show episodes. You can watch every episode on YouTube:
      <a href="https://www.youtube.com/@noisemakersnews">youtube.com/@noisemakersnews</a>
    </noscript>
    <!--
      Netlify Forms reads this hidden form at deploy time to learn the fields of the
      "Tell your story" form, which React renders at /tell-your-story. Keep the names
      in sync with FIELD_NAMES in src/lib/storyForm.ts (npm test checks this).
    -->
    <form name="tell-your-story" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="reference" />
      <input name="request_type" />
      <input name="full_name" />
      <input name="email" />
      <input name="phone" />
      <input name="preferred_contact" />
      <input name="profile_link" />
      <input name="story_title" />
      <textarea name="story_summary"></textarea>
      <textarea name="why_share"></textarea>
      <input name="topics" />
      <input name="interview_format" />
      <textarea name="availability"></textarea>
      <textarea name="additional_info"></textarea>
      <input name="consents" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
