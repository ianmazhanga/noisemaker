name: Sync YouTube videos

# Checks the channel for new, changed or removed videos every hour and commits
# src/data/youtube.json when something changed. Netlify then rebuilds the site.
# GitHub may start scheduled runs a little late when it is busy.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch the channel's videos
        run: npm run sync:youtube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Check the content
        run: npm test

      - name: Commit changes
        run: |
          if git diff --quiet -- src/data/youtube.json; then
            echo "No changes on the channel."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/youtube.json
          git commit -m "Sync YouTube videos"
          git pull --rebase
          git push
