name: Scheduled jobs

# Runs the dashboard's scheduled work by calling the site: due posts, articles and
# newsletters every 15 minutes; YouTube, news and subscriber syncs every hour.
# (Vercel's own scheduler runs the daily tasks; on the free plan it can't run more often.)
#
# Repository secrets needed: CRON_SECRET (the same value as in Vercel) and SITE_URL,
# e.g. https://noisemaker-olive.vercel.app

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'tick, hourly or daily'
        default: tick

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the site
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          MANUAL_JOB: ${{ github.event.inputs.job }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SITE_URL" ]; then
            echo "CRON_SECRET and SITE_URL aren't set as repository secrets, so scheduled jobs are off."
            exit 0
          fi
          call() {
            echo "Running $1"
            curl --fail-with-body -sS -m 280 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/$1"
            echo
          }
          if [ -n "$MANUAL_JOB" ]; then call "$MANUAL_JOB"; exit 0; fi
          call tick
          # The first run of each hour also does the hourly syncs.
          if [ "$(date -u +%M)" -lt 15 ]; then call hourly; fi
